name: Deploy VPS Controller

on:
  push:
    branches:
      - main
    paths:
      - 'VPS-Controller/backend/**'
      - 'VPS-Controller/agent/**'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-controller-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy VPS
    runs-on: ubuntu-latest

    steps:
      - name: Preparar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_controller_actions
          chmod 600 ~/.ssh/vps_controller_actions

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/vps_controller_actions \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo /usr/local/sbin/deploy-vps-controller'