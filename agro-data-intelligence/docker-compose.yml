# Versão do Docker Compose e definição de serviços
services:
  # ============================================================================
  # SERVIÇO: BANCO DE DADOS POSTGRESQL (DW / Metadados)
  # ============================================================================
  postgres:
    # Imagem oficial leve baseada em Alpine Linux
    image: postgres:16-alpine
    container_name: agro-postgres
    # Reinicia automaticamente o container a menos que tenha sido parado manualmente
    restart: unless-stopped
    # Variáveis de ambiente lidas a partir do arquivo .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Mapeamento de portas (Host:Container). 
    # Vinculado em 127.0.0.1 para evitar exposição direta à internet
    ports:
      - "127.0.0.1:15432:5432"
    # Persistência de dados e script de inicialização
    volumes:
      # Volume nomeado para persistir dados do PostgreSQL entre recriações de containers
      - postgres_data:/var/lib/postgresql/data
      # Script SQL montado como somente leitura (:ro) executado apenas na primeira criação do banco
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Limite máximo de memória RAM que o container pode consumir
    mem_limit: 2g
    # Checagem de integridade (Healthcheck) para verificar se o banco aceita conexões
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Rede isolada para comunicação entre containers
    networks:
      - agro-net

  # ============================================================================
  # SERVIÇO: OBJECT STORAGE S3-COMPATIBLE (MINIO - Data Lake Raw/Bronze/Silver)
  # ============================================================================
  minio:
    # Imagem aberta e mantida publicamente pela Chainguard (substitui imagens descontinuadas/privatizadas)
    image: cgr.dev/chainguard/minio:latest
    container_name: agro-minio
    restart: unless-stopped
    # Comando de inicialização do MinIO e porta do console web (:9001)
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # Exposição de portas: 9000 (API S3) e 9001 (Console Web / UI)
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      # Volume nomeado onde os buckets e arquivos (objetos) serão armazenados
      - minio_data:/data
    mem_limit: 1g
    networks:
      - agro-net

  # ============================================================================
  # SERVIÇO: AIRFLOW (Orquestrador de Pipelines)
  # ============================================================================
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: agro-airflow
    restart: unless-stopped
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./dbt_agro:/opt/airflow/dbt_agro
    command: >
      bash -c "airflow db migrate &&
               (airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin || true) &&
               (airflow webserver & exec airflow scheduler)"
    mem_limit: 3g
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agro-net

  # ============================================================================
  # SERVIÇO: SUPERSET (Visualização e Dashboards)
  # ============================================================================
  superset:
    image: apache/superset:latest
    container_name: agro-superset
    restart: unless-stopped
    environment:
      - SUPERSET_SECRET_KEY=uma_chave_secreta_muito_longa_aqui
      - DATABASE_DB=superset
      - DATABASE_HOST=postgres
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_USER=${POSTGRES_USER}
    ports:
      - "127.0.0.1:8088:8088"
    mem_limit: 2g
    command: >
      bash -c "superset db upgrade &&
               (superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password admin || true) &&
               superset init &&
               /usr/bin/run-server.sh"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agro-net

# ==============================================================================
# DEFINIÇÃO DE VOLUMES PERSISTENTES
# ==============================================================================
volumes:
  postgres_data:  # Armazena os arquivos físicos do Postgres no host gerenciado pelo Docker
  minio_data:     # Armazena os buckets e arquivos enviados para o MinIO

# ==============================================================================
# REDE ISOLADA (BRIDGE)
# ==============================================================================
networks:
  agro-net:
    driver: bridge # Permite comunicação direta entre containers usando o nome do serviço como host
