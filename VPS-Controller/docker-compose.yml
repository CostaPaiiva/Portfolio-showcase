services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  monitor:
    build:
      context: ./monitor
    restart: unless-stopped
    env_file:
      - ./monitor/.env
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
